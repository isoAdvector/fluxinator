#
# Builds fluxinator with every supported OpenFOAM.com release (OpenCFD's Ubuntu
# packages) and runs both solvers for a few time steps of the tilted box of
# Part I and the accelerated disc of Part II.

name: Build

# Only for changes to the code and its build, on main and in pull requests,
# or when started by hand; a newer run on the same branch cancels an older one
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "applications/**"
      - "bin/**"
      - "Allwmake"
      - "Allwclean"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "applications/**"
      - "bin/**"
      - "Allwmake"
      - "Allwclean"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: OpenFOAM v${{ matrix.version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        version: ["2306", "2312", "2406", "2412", "2506", "2512", "2606"]
    env:
      OPENFOAM: /usr/lib/openfoam/openfoam${{ matrix.version }}

    steps:
      - uses: actions/checkout@v4

      # The packages come from SourceForge mirrors, which are slow and sometimes time
      # out: keep the downloaded packages in the Actions cache, one entry per version
      - name: Restore OpenFOAM v${{ matrix.version }} packages
        id: debs
        uses: actions/cache/restore@v4
        with:
          path: ~/debs
          key: openfoam-debs-${{ matrix.version }}-noble

      - name: Install OpenFOAM v${{ matrix.version }}
        run: |
          curl -s https://dl.openfoam.com/add-debian-repo.sh | sudo bash
          mkdir -p ~/debs/partial
          sudo apt-get install -y -o Dir::Cache::Archives="$HOME/debs" -o Acquire::Retries=5 \
              openfoam${{ matrix.version }}-default
          sudo rm -rf ~/debs/partial ~/debs/lock
          sudo chown -R "$USER" ~/debs

      # Saved right after the install, so that a failing build still fills the cache
      - name: Save OpenFOAM v${{ matrix.version }} packages
        if: steps.debs.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/debs
          key: openfoam-debs-${{ matrix.version }}-noble

      - name: Build
        run: |
          set +e; source "$OPENFOAM/etc/bashrc"; set -e
          ./Allwmake -j 4 2>&1 | tee log.Allwmake
          # Allwmake continues after a failed wmake: check the build products
          if grep -q "Error [0-9]" log.Allwmake; then exit 1; fi
          for app in fluxinator interIsoGoam setHydrostaticPressure convectionTest \
              interFoamDdtCorr interIsoFoamDdtCorr
          do
              test -x "$FOAM_USER_APPBIN/$app" || { echo "Missing $app"; exit 1; }
          done
          for lib in fluxinatorVoF gravityModels interfaceSchemes interfaceFunctionObjects
          do
              test -f "$FOAM_USER_LIBBIN/lib$lib.so" || { echo "Missing lib$lib.so"; exit 1; }
          done

      - name: Smoke test
        run: |
          set +e; source "$OPENFOAM/etc/bashrc"; set -e
          for app in interIsoGoam fluxinator
          do
              # Tilted box at rest: walls only, geometric gravity model, plicRDF
              case=$RUNNER_TEMP/box_$app
              cp -r run/tiltedBox/baseCase "$case"
              (
                  cd "$case"
                  cp -r 0.orig 0
                  foamDictionary system/controlDict -entry application -set $app > /dev/null
                  foamDictionary system/controlDict -entry endTime -set 0.05 > /dev/null
                  blockMesh > log.blockMesh 2>&1
                  transformPoints -centre '(.5 0 .5)' -rotate-y 5 > log.transformPoints 2>&1
                  setAlphaField > log.setAlphaField 2>&1
                  $app > log.$app 2>&1 || { tail -n 30 log.$app; exit 1; }
              )

              # Accelerated periodic disc: explicit Lax-Wendroff convection with
              # interfaceUpwind. plicRDF needs v2506 or later on cyclic patches.
              case=$RUNNER_TEMP/disc_$app
              cp -r run/periodicDisc/explicitLWIU_rhoNew "$case"
              (
                  cd "$case"
                  cp -r 0.orig 0
                  foamDictionary system/controlDict -entry application -set $app > /dev/null
                  foamDictionary system/controlDict -entry endTime -set 0.05 > /dev/null
                  if [ "${WM_PROJECT_VERSION#v}" -lt 2506 ]
                  then
                      sed -i 's/reconstructionScheme *plicRDF;/reconstructionScheme isoAlpha;/' \
                          system/fvSolution
                  fi
                  blockMesh > log.blockMesh 2>&1
                  setAlphaField > log.setAlphaField 2>&1
                  $app > log.$app 2>&1 || { tail -n 30 log.$app; exit 1; }
              )
          done
